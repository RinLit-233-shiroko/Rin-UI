name: Build & Release RinUI Gallery

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.2.3); required when publish_release is true"
        required: false
        type: string
      publish_release:
        description: "Create or update a GitHub Release"
        required: true
        default: false
        type: boolean
      build_target:
        description: "Build target: all = Windows ZIP + macOS ZIP + signed MSIX"
        required: true
        default: all
        type: choice
        options:
          - all
          - win
          - mac
          - win+msix

concurrency:
  group: build-${{ github.head_ref || github.ref_name || github.event.inputs.tag || github.run_id }}
  cancel-in-progress: true

jobs:
  build-windows:
    if: |
      github.event_name == 'push' ||
      github.event.inputs.build_target == 'all' ||
      github.event.inputs.build_target == 'win' ||
      github.event.inputs.build_target == 'win+msix'
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python & uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv sync
          uv pip install pyinstaller

      - name: Build RinUI Gallery (Windows)
        shell: bash
        run: |
          uv run pyinstaller --noconsole \
            --icon "examples/assets/icons/app/gallery.ico" \
            --add-data "RinUI:RinUI" \
            --add-data "examples/assets:assets" \
            --add-data "examples/components:components" \
            --add-data "examples/languages:languages" \
            --add-data "examples/pages:pages" \
            --add-data "examples/gallery.qml:." \
            --paths=. \
            --contents-directory . \
            --name=RinUIGallery \
            examples/gallery.py

      - name: Build MSIX package
        id: msix
        if: |
          github.event_name == 'push' ||
          github.event.inputs.build_target == 'all' ||
          github.event.inputs.build_target == 'win+msix'
        shell: pwsh
        env:
          MSIX_CERTIFICATE_BASE64: ${{ secrets.MSIX_CERTIFICATE_BASE64 }}
          MSIX_CERTIFICATE_PASSWORD: ${{ secrets.MSIX_CERTIFICATE_PASSWORD }}
        run: |
          $version = "${{ github.event.inputs.tag }}"
          if (-not $version -and "${{ github.ref }}".StartsWith("refs/tags/")) {
            $version = "${{ github.ref_name }}"
          }
          if (-not $version) {
            $version = "0.0.${{ github.run_number }}.0"
          }

          $parameters = @{
            Version = $version
            OutputDirectory = "dist/msix"
          }
          if ($env:MSIX_CERTIFICATE_BASE64) {
            $pfx = Join-Path $env:RUNNER_TEMP "RinUI-msix.pfx"
            [IO.File]::WriteAllBytes(
              $pfx,
              [Convert]::FromBase64String($env:MSIX_CERTIFICATE_BASE64)
            )
            $parameters.CertificatePath = $pfx
            $parameters.CertificatePassword = $env:MSIX_CERTIFICATE_PASSWORD
            $cert = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2($pfx, $env:MSIX_CERTIFICATE_PASSWORD)
            $publicCert = Join-Path $env:RUNNER_TEMP "RinUI-Gallery-Signing.cer"
            [IO.File]::WriteAllBytes($publicCert, $cert.Export([System.Security.Cryptography.X509Certificates.X509ContentType]::Cert))
            Copy-Item $publicCert "dist/RinUI-Gallery-Signing.cer"
            "has_certificate=true" >> $env:GITHUB_OUTPUT
          } else {
            Write-Warning "MSIX_CERTIFICATE_BASE64 is not configured; creating an unsigned MSIX package."
            $parameters.SkipSign = $true
          }
          ./packaging/msix/package_msix.ps1 @parameters

      - name: Create Windows archive
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "dist/RinUIGallery/*" `
            -DestinationPath "dist/RinUIGallery-Windows.zip" `
            -CompressionLevel Optimal
          Get-ChildItem dist/ -Name

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: RinUIGallery-Windows
          path: dist/RinUIGallery-Windows.zip

      - name: Upload MSIX artifact
        if: |
          github.event_name == 'push' ||
          github.event.inputs.build_target == 'all' ||
          github.event.inputs.build_target == 'win+msix'
        uses: actions/upload-artifact@v7
        with:
          name: RinUIGallery-MSIX
          path: dist/msix/*.msix

      - name: Upload MSIX signing certificate
        if: steps.msix.outputs.has_certificate == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: RinUIGallery-MSIX-Certificate
          path: dist/RinUI-Gallery-Signing.cer

      - name: Create MSIX scaffold archive
        if: |
          github.event_name == 'push' ||
          github.event.inputs.build_target == 'all' ||
          github.event.inputs.build_target == 'win+msix'
        shell: pwsh
        run: |
          $stage = "dist/RinUI-MSIX-Template"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item "packaging/msix/README.md" "$stage/README.md"
          Copy-Item "packaging/msix/package_msix.ps1" $stage
          Copy-Item "packaging/msix/gallery.spec" $stage
          Copy-Item "examples/AppxManifest.xml" $stage
          Compress-Archive `
            -Path "$stage/*" `
            -DestinationPath "dist/RinUI-MSIX-Template.zip" `
            -CompressionLevel Optimal

      - name: Upload MSIX scaffold
        if: |
          github.event_name == 'push' ||
          github.event.inputs.build_target == 'all' ||
          github.event.inputs.build_target == 'win+msix'
        uses: actions/upload-artifact@v7
        with:
          name: RinUI-MSIX-Template
          path: dist/RinUI-MSIX-Template.zip

  build-macos:
    if: |
      github.event_name == 'push' ||
      github.event.inputs.build_target == 'all' ||
      github.event.inputs.build_target == 'mac'
    runs-on: macos-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python & uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv sync
          uv pip install pyinstaller

      - name: Build RinUI Gallery (macOS)
        shell: bash
        run: |
          uv run pyinstaller --noconsole \
            --icon "examples/assets/icons/app/gallery.icns" \
            --add-data "RinUI:RinUI" \
            --add-data "examples/assets:assets" \
            --add-data "examples/components:components" \
            --add-data "examples/languages:languages" \
            --add-data "examples/pages:pages" \
            --add-data "examples/gallery.qml:." \
            --paths=. \
            --contents-directory . \
            --name=RinUIGallery \
            examples/gallery.py

      - name: Create macOS archive
        shell: bash
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent RinUIGallery.app RinUIGallery-macOS.zip
          ls -lh

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: RinUIGallery-macOS
          path: dist/RinUIGallery-macOS.zip

  release:
    needs: [build-windows, build-macos]
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    runs-on: ubuntu-latest
    if: |
      always() &&
      !cancelled() &&
      (github.event_name == 'push' || github.event.inputs.publish_release == 'true') &&
      (needs.build-windows.result == 'success' || needs.build-windows.result == 'skipped') &&
      (needs.build-macos.result == 'success' || needs.build-macos.result == 'skipped') &&
      (needs.build-windows.result == 'success' || needs.build-macos.result == 'success')
    env:
      TAG_NAME: ${{ github.event.inputs.tag || github.ref_name }}

    steps:
      - name: Validate dispatch release tag
        if: |
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.publish_release == 'true' &&
          github.event.inputs.tag == ''
        shell: bash
        run: |
          echo "publish_release=true requires a non-empty tag input."
          exit 1

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist/
          pattern: RinUIGallery-*
          merge-multiple: true

      - name: List release files
        run: ls -lh dist/

      - name: Set up git-cliff
        uses: kenji-miyake/setup-git-cliff@v2

      - name: Generate CHANGELOG
        id: changelog
        env:
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git cliff --latest --tag "$TAG_NAME" --config .git-cliff.toml --github-repo "$GITHUB_REPO" --output changelog.md

      - name: Attest artifacts
        id: attest
        uses: actions/attest@v4
        with:
          subject-path: dist/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: RinUI Gallery ${{ env.TAG_NAME }}
          tag_name: ${{ env.TAG_NAME }}
          body_path: changelog.md
          files: |
            dist/*
            ${{ steps.attest.outputs.bundle-path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
